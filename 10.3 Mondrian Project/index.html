<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .container {
      height: 748px;
      width: 757px; 
      display: grid;
      gap: 9px;
      grid-template: 1fr 1fr / 320px 1fr;
      grid-auto-rows: 1fr;
      background-color: #000;
    } 

    .red {
      background-color: #E72F24;
      height: 414px;
      width: 320px;
    }

    .gra {
      background-color: lightgray;
    }

    .y1 {
      height: 414px;
      width: 428px;
    }

    .y2 {
      height: 314px;
      width: 320px;
    }
    
    .y3 {
      height: 314px;
      width: 370px;
      grid-row: span 2;
    }

    .y4 {
      height: 20px;
      width: 320px;
    }

    .y5 {
      height: 186px;
      width: 50px;
      order: 2;
    }

    .blue {
      background-color: #004592;
      height: 130px;
      width: 50px;
      order: 1;
    }

    .yellow {
      background-color: #F9D01E;
      height: 20px;
      width: 206px;
      order: 1;
    }

    .dgray {
      background-color: #232629;
      height: 20px;
      width: 153px;
      order: 2;
    }

    .container-1 {
      display: flex;
      flex-direction: rows;
      gap: 9px;
      background-color: #000;
      width: 699px;
    }

    .container-2 {
      display: grid;
      grid-template: 150px 1fr / 1fr 1fr;
      gap: 9px;
      background-color: #000;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="container">
    <div class="red"></div>
    <div class="gra y1"></div>
    <div class="gra y2"></div>
    <div class="container-2">
      <div class="gra y3"></div>
      <div class="gra y5"></div>
      <div class="blue"></div>
    </div>
  </div>
  <div class="container-1">
      <div class="yellow"></div>
      <div class="gra y4"></div>
      <div class="dgray"></div>
    </div>
</body>

</html>
